name: CI

on:
  push:
    branches:
      - "main"
      - "develop"
  pull_request:
    branches: [main, develop]

jobs:
  fossa-scan:
    continue-on-error: true
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: run fossa anlyze and create report
        run: |
          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash
          fossa analyze --debug
          fossa report attribution --format text > /tmp/THIRDPARTY
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
      - name: upload THIRDPARTY file
        uses: actions/upload-artifact@v4
        with:
          name: THIRDPARTY
          path: /tmp/THIRDPARTY
      - name: run fossa test
        run: |
          fossa test --debug
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

  compliance-copyrights:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: apache/skywalking-eyes@v0.6.0

  test-unit:
    name: Test Unit Splunk ${{ matrix.splunk-version }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      SPLUNK_HOME: /opt/splunk
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pins and SHA512 checksums from the official Splunk download pages.
          - splunk-version: "9.4.16"
            python-version: "3.9"
            splunk-build: "fbe3c1243d26"
            splunk-sha512: "477e6d5b42df82044fe7fe7ef0c5641583e095bd2742653994f95d76e9ab96b61ca25e0be3111bfea5865842a0d8195706c3be78b3243bdecff24bc5055b06f3"
          - splunk-version: "10.6.1.1"
            python-version: "3.9"
            splunk-build: "b2ae2962645c"
            splunk-sha512: "8c039281a6669b972abf641ec6e6cf2e2102b6e7c188dc3bdf64938c921087fe8da6b7035ed0f17240286bf63723c421da155c2f64fdd766aa25c7c51df36efc"
          - splunk-version: "10.6.1.1"
            python-version: "3.13"
            splunk-build: "b2ae2962645c"
            splunk-sha512: "8c039281a6669b972abf641ec6e6cf2e2102b6e7c188dc3bdf64938c921087fe8da6b7035ed0f17240286bf63723c421da155c2f64fdd766aa25c7c51df36efc"
    steps:
      - uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: curl -sSL https://install.python-poetry.org | python3 - --version 1.8.5
      - name: Install Splunk
        env:
          SPLUNK_VERSION: ${{ matrix.splunk-version }}
          SPLUNK_BUILD: ${{ matrix.splunk-build }}
          SPLUNK_SHA512: ${{ matrix.splunk-sha512 }}
        run: |
          archive="splunk-${SPLUNK_VERSION}-${SPLUNK_BUILD}-linux-amd64.tgz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 30 \
            "https://download.splunk.com/products/splunk/releases/${SPLUNK_VERSION}/linux/${archive}" \
            --output "${archive_path}"
          printf '%s  %s\n' "${SPLUNK_SHA512}" "${archive_path}" | sha512sum --check
          sudo tar -C /opt -zxf "${archive_path}"
          rm -- "${archive_path}"
          sudo chown -R "$USER:$USER" "$SPLUNK_HOME"
          mkdir -p "$SPLUNK_HOME/etc/system/local"
          printf '[user_info]\nUSERNAME=admin\nPASSWORD=CloudConnectCI-42!\n' \
            > "$SPLUNK_HOME/etc/system/local/user-seed.conf"
          printf '[settings]\nstartwebserver = 0\n' \
            > "$SPLUNK_HOME/etc/system/local/web.conf"
          printf 'OPTIMISTIC_ABOUT_FILE_LOCKING=1\n' >> "$SPLUNK_HOME/etc/splunk-launch.conf"
          "$SPLUNK_HOME/bin/splunk" start --accept-license --answer-yes --no-prompt
      - name: Install Code
        run: poetry install
      - name: Run Pytest with coverage
        run: poetry run pytest --cov=./cloudconnectlib --cov-report=xml --junitxml=test-results/junit.xml test/unit
      - uses: actions/upload-artifact@v4 # upload test results
        if: success() || failure() # run this step even if previous step failed
        with:
          name: test-results-splunk_${{ matrix.splunk-version }}-python_${{ matrix.python-version }}
          path: |
            test-results/*
            coverage.xml

  pre-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: pre-commit/action@v3.0.1

  semgrep:
    uses: splunk/sast-scanning/.github/workflows/sast-scan.yml@main
    secrets:
      SEMGREP_KEY: ${{ secrets.SEMGREP_PUBLISH_TOKEN }}

  build:
    name: Build Release
    needs:
      - test-unit
      - pre-commit
      - semgrep
      - compliance-copyrights
      - fossa-scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          #Very Important semantic-release won't trigger a tagged
          #build if this is not set false
          persist-credentials: false
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install Poetry
        run: | 
          curl -sSL https://install.python-poetry.org | python3 - --version 1.8.5
          poetry build
      - uses: actions/download-artifact@v4
        with:
          name: THIRDPARTY
      - name: Update Notices
        run: cp -f THIRDPARTY NOTICE
      - id: semantic
        uses: splunk/semantic-release-action@v1.3
        with:
          git_committer_name: ${{ secrets.SA_GH_USER_NAME }}
          git_committer_email: ${{ secrets.SA_GH_USER_EMAIL }}
          gpg_private_key: ${{ secrets.SA_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.SA_GPG_PASSPHRASE }}
          extra_plugins: |
            semantic-release-replace-plugin
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - if: ${{ steps.semantic.outputs.new_release_published == 'true' }}
        run: |
          poetry build
          poetry publish -n -u ${{ secrets.PYPI_USERNAME }} -p ${{ secrets.PYPI_TOKEN }}
